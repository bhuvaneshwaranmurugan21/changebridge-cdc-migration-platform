name: Part 3 Stage 3 AWS Admission

on:
  pull_request:
    paths:
      - "deployment/stage3/**"
      - "requirements/part3-stage3-*"
      - "scripts/*stage33*"
      - "tests/test_part3_stage3_*"
      - "tests/test_stage33_*"
      - "evidence/part3/stage3/**"
      - "docs/part3/stage3/**"
      - "PART3_STAGE3_STATUS.md"
      - ".github/workflows/part3-stage3-aws-admission.yml"

permissions:
  contents: read

jobs:
  admission-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_part3_stage3.py
      - run: python scripts/validate_stage33_access_evidence.py
      - run: mypy scripts/validate_stage33_access_evidence.py scripts/prepare_stage33_bootstrap.py scripts/stage33_bootstrap_journal.py scripts/qualify_stage33_bootstrap.py scripts/prepare_stage33_cleanup.py
      - run: bash -n scripts/install_stage33_role_observer.sh
      - run: bash -n scripts/collect_stage33_access_diagnostic.sh
      - run: pytest --no-cov tests/test_part3_stage3_validator.py tests/test_stage33_oidc_qualification.py tests/test_stage33_role_observer_installation.py tests/test_stage33_access_diagnostic.py tests/test_stage33_access_evidence.py tests/test_stage33_bootstrap_package.py tests/test_stage33_bootstrap_journal.py tests/test_stage33_bootstrap_qualification.py tests/test_stage33_cleanup_plan.py
