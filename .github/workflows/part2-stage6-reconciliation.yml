name: Part 2 Stage 6 Reconciliation Proof

on:
  pull_request:
    paths:
      - "src/changebridge/hierarchical_reconciliation.py"
      - "src/changebridge/proof_*.py"
      - "scripts/*stage26*"
      - "jobs/spark_iceberg_reconcile.py"
      - "tests/*stage26*"
      - "tests/integration/test_stage26*"
      - "evidence/part2/stage6/**"
      - ".github/workflows/part2-stage6-reconciliation.yml"

permissions:
  contents: read

jobs:
  postgres-source-observer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_PASSWORD: stage26
          POSTGRES_USER: stage26
          POSTGRES_DB: changebridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stage26 -d changebridge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CB_STAGE26_POSTGRES_DSN: postgresql://stage26:stage26@127.0.0.1:5432/changebridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev]'
      - run: pytest --no-cov tests/integration/test_stage26_postgres_source.py

  spark-iceberg-proof:
    runs-on: ubuntu-latest
    env:
      CB_ICEBERG_JAR: /tmp/changebridge-iceberg/iceberg.jar
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev,spark]'
      - name: Acquire checksum-pinned Iceberg
        run: |
          mkdir -p /tmp/changebridge-iceberg
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.11.0/iceberg-spark-runtime-3.5_2.12-1.11.0.jar \
            --output "$CB_ICEBERG_JAR"
          echo "94b8e36fc329f0293d44ba9e01b784a56e9501affec1842d898144c51f6e486a  $CB_ICEBERG_JAR" | sha256sum --check --strict
      - run: pytest --no-cov tests/test_hierarchical_reconciliation.py tests/test_stage26_proof_control.py
      - run: python scripts/validate_part2_stage6.py
