name: Stage 4 evidence finalizer
on:
  push:
    branches: [part2-stage4-transactional-apply]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'bhuvaneshwaranmurugan21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated Stage 4 evidence
        env:
          PATCH_XZ_B64: >-
            
        run: |
          printf '%s' "$PATCH_XZ_B64" | base64 --decode | xz --decompress > /tmp/stage4-final.patch
          git apply --index /tmp/stage4-final.patch
          git rm .github/workflows/stage4-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: bind Stage 4 evidence and claims"
          git push origin "HEAD:${GITHUB_REF_NAME}"
