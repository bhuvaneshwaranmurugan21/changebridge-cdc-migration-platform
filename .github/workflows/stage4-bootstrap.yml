name: Stage 4 branch bootstrap
on:
  push:
    branches: [part2-stage4-transactional-apply]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'bhuvaneshwaranmurugan21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated Stage 4 source
        env:
          PATCH_XZ_B64: >-
            
        run: |
          printf '%s' "$PATCH_XZ_B64" | base64 --decode | xz --decompress > /tmp/stage4.patch
          git apply --index /tmp/stage4.patch
          git rm .github/workflows/stage4-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement recoverable Stage 4 CDC apply"
          git push origin "HEAD:${GITHUB_REF_NAME}"
