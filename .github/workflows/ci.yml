name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src scripts/stage21_postgres_adapter.py scripts/run_stage21_postgres_lab.py
      - run: pytest
      - name: Validate frozen Part 1 closure authority
        run: python scripts/validate_part1_frozen.py
      - name: Verify protected Part 1 evidence in the current tree
        run: python scripts/validate_part1_preservation.py
      - name: Validate Part 2 Stage 1 evidence and scope
        run: python scripts/validate_part2_stage1.py
      - name: Regenerate deterministic evidence
        run: |
          python -m changebridge.cli simulate --output /tmp/changebridge-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/changebridge-evidence.json').read_text())
          assert evidence['result'] == 'PASS'
          assert evidence['production_claim'] is False
          PY
