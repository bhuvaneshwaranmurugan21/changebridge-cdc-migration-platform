name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CB_ICEBERG_JAR: /tmp/changebridge-iceberg/iceberg-spark-runtime-3.5_2.12-1.11.0.jar
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,spark]'
      - name: Acquire checksum-pinned Iceberg runtime
        run: |
          mkdir -p /tmp/changebridge-iceberg
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.11.0/iceberg-spark-runtime-3.5_2.12-1.11.0.jar \
            --output "$CB_ICEBERG_JAR"
          echo "94b8e36fc329f0293d44ba9e01b784a56e9501affec1842d898144c51f6e486a  $CB_ICEBERG_JAR" \
            | sha256sum --check --strict
      - run: ruff check .
      - run: >-
          mypy src
          scripts/stage21_postgres_adapter.py
          scripts/run_stage21_postgres_lab.py
          scripts/build_stage23_fixtures.py
          scripts/run_stage23_iceberg_lab.py
          jobs/spark_iceberg_snapshot.py
      - run: pytest
      - name: Validate frozen Part 1 closure authority
        run: python scripts/validate_part1_frozen.py
      - name: Verify protected Part 1 evidence in the current tree
        run: python scripts/validate_part1_preservation.py
      - name: Validate frozen Part 2 Stage 1 evidence and scope
        run: python scripts/validate_part2_stage1_frozen.py
      - name: Validate Part 2 Stage 2 normalization evidence and scope
        run: python scripts/validate_part2_stage2.py
      - name: Validate Part 2 Stage 3 snapshot-generation evidence and scope
        run: python scripts/validate_part2_stage3.py
      - name: Regenerate deterministic evidence
        run: |
          python -m changebridge.cli simulate --output /tmp/changebridge-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/changebridge-evidence.json').read_text())
          assert evidence['result'] == 'PASS'
          assert evidence['production_claim'] is False
          PY
