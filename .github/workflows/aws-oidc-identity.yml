name: AWS OIDC Identity Check

on:
  workflow_dispatch:
    inputs:
      qualify_stage3:
        description: "Read-only IAM qualification on the exact ChangeBridge main branch"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/aws-oidc-identity.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-identity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard Stage 3 qualification scope before credentials
        if: inputs.qualify_stage3
        env:
          CB_REPOSITORY: ${{ github.repository }}
          CB_REF: ${{ github.ref }}
          CB_EVENT: ${{ github.event_name }}
          CB_QUALIFY: ${{ inputs.qualify_stage3 && 'true' || 'false' }}
          CB_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          CB_REGION: ${{ vars.AWS_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CB_REPOSITORY" == "bhuvaneshwaranmurugan21/changebridge-cdc-migration-platform" ]]
          [[ "$CB_REF" == "refs/heads/main" ]]
          [[ "$CB_EVENT" == "workflow_dispatch" && "$CB_QUALIFY" == "true" ]]
          [[ "$CB_ROLE_ARN" == "arn:aws:iam::857229544428:role/ChangeBridgeGitHubOidcRole" ]]
          [[ "$CB_REGION" == "ap-southeast-2" ]]
          echo "Exact Stage 3 read-only scope verified before credential acquisition."
      - name: Assume repository-specific AWS role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-oidc-identity-check
          retry-max-attempts: ${{ inputs.qualify_stage3 && 2 || 12 }}
          mask-aws-account-id: true

      - name: Verify caller role
        env:
          EXPECTED_ROLE: ChangeBridgeGitHubOidcRole
        shell: bash
        run: |
          set -euo pipefail
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          if [[ "$caller_arn" != *":assumed-role/${EXPECTED_ROLE}/"* ]]; then
            echo "::error::Unexpected AWS caller role"
            exit 1
          fi
          echo "OIDC identity verified for ${EXPECTED_ROLE}."

      - name: Qualify existing ChangeBridge IAM role read-only
        if: github.ref == 'refs/heads/main' && inputs.qualify_stage3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          qualification_dir="$(mktemp -d /tmp/changebridge-stage33-iam.XXXXXX)"
          readonly role_name="ChangeBridgeGitHubOidcRole"
          readonly role_arn="arn:aws:iam::857229544428:role/ChangeBridgeGitHubOidcRole"
          read_api() {
            local receipt_name="$1"
            shift
            local api_exit=0
            aws "$@" --output json > "$qualification_dir/$receipt_name.json" \
              2> "$qualification_dir/$receipt_name.stderr" || api_exit=$?
            if [[ "$api_exit" -ne 0 ]]; then
              echo "READ_ONLY_API_FAILED=$receipt_name EXIT=$api_exit" >&2
              head -c 4096 "$qualification_dir/$receipt_name.stderr" >&2
              exit "$api_exit"
            fi
          }
          read_api caller sts get-caller-identity
          jq -e --arg role "$role_name" \
            '.Account == "857229544428" and (.Arn | startswith("arn:aws:sts::857229544428:assumed-role/" + $role + "/"))' \
            "$qualification_dir/caller.json" > /dev/null
          read_api role iam get-role --role-name "$role_name"
          jq -e --arg arn "$role_arn" '.Role.Arn == $arn' "$qualification_dir/role.json" > /dev/null
          jq '{Role: {Arn: .Role.Arn, RoleId: .Role.RoleId, MaxSessionDuration: .Role.MaxSessionDuration,
            PermissionsBoundary: .Role.PermissionsBoundary, AssumeRolePolicyDocument: .Role.AssumeRolePolicyDocument}}' \
            "$qualification_dir/role.json"
          read_api inline-list iam list-role-policies --role-name "$role_name"
          read_api attached-list iam list-attached-role-policies --role-name "$role_name"
          while IFS= read -r policy_name; do
            policy_id="$(printf '%s' "$policy_name" | sha256sum | cut -c1-16)"
            read_api "inline-$policy_id" iam get-role-policy --role-name "$role_name" --policy-name "$policy_name"
            jq '{RoleName, PolicyName, PolicyDocument}' "$qualification_dir/inline-$policy_id.json"
          done < <(jq -r '.PolicyNames[]' "$qualification_dir/inline-list.json")
          jq -r '.AttachedPolicies[].PolicyArn' "$qualification_dir/attached-list.json" > "$qualification_dir/policy-arns.txt"
          jq -r '.Role.PermissionsBoundary.PermissionsBoundaryArn // empty' \
            "$qualification_dir/role.json" >> "$qualification_dir/policy-arns.txt"
          while IFS= read -r policy_arn; do
            [[ -n "$policy_arn" ]] || continue
            policy_id="$(printf '%s' "$policy_arn" | sha256sum | cut -c1-16)"
            read_api "policy-$policy_id" iam get-policy --policy-arn "$policy_arn"
            policy_version="$(jq -er '.Policy.DefaultVersionId' "$qualification_dir/policy-$policy_id.json")"
            read_api "version-$policy_id" iam get-policy-version --policy-arn "$policy_arn" --version-id "$policy_version"
            jq --arg arn "$policy_arn" '{PolicyArn: $arn, VersionId: .PolicyVersion.VersionId,
              IsDefaultVersion: .PolicyVersion.IsDefaultVersion, Document: .PolicyVersion.Document}' \
              "$qualification_dir/version-$policy_id.json"
          done < "$qualification_dir/policy-arns.txt"
          echo "READ_ONLY_IAM_COLLECTION=COMPLETE AWS_MUTATIONS=0"
          echo "TRUST_AND_PERMISSION_ACCEPTANCE=REQUIRES_INDEPENDENT_REVIEW"
