name: Part 3 Stage 2 Deployable Platform

on:
  pull_request:
    paths:
      - "deployment/**"
      - "requirements/part3-stage2-*"
      - "scripts/*stage32*"
      - "tests/test_part3_stage2_*"
      - "evidence/part3/stage2/**"
      - ".github/workflows/part3-stage2-deployable-platform.yml"

permissions:
  contents: read

jobs:
  offline-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev,spark]'
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.9.8"}
      - run: terraform fmt -check -diff -recursive deployment/terraform
      - run: terraform -chdir=deployment/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=deployment/terraform validate
      - run: python scripts/package_stage32_runtime.py --output /tmp/runtime-a.zip
      - run: python scripts/package_stage32_runtime.py --output /tmp/runtime-b.zip
      - run: cmp /tmp/runtime-a.zip /tmp/runtime-b.zip
      - run: python scripts/validate_part3_stage2.py
      - run: pytest --no-cov tests/test_part3_stage2_validator.py
